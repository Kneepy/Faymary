version: '0.0'
services:
  messages_db:
    container_name: messages_db
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: messages
    image: postgres:latest
    restart: always
    volumes:
      - messages_db:/var/lib/postgres
    ports:
      - 5434:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U postgres -d messages"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - messages_service
  cache_db:
    container_name: messages_cache_db
    image: redis:7.2.3-alpine
    restart: always
    ports:
      - 6374:6379
    networks:
      - messages_service
  messages:
    container_name: messages
    build: .
    ports:
      - 5004:5004
    command: npm run start:prod
    depends_on:
      messages_db:
        condition: service_healthy
    extra_hosts:
      - "docker.for.win.localhost:host-gateway"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: messages
      POSTGRES_HOST: messages_db
      POSTGRES_PORT: 5432
      REDIS_PORT: 6379
      REDIS_HOST: cache_db
    networks:
      - microservices
      - messages_service
volumes:
  messages_db:
networks:
  microservices:
    name: microservices
    external: true
  messages_service:
