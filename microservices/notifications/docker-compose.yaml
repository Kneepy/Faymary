version: '0.0'
services:
  notifications_db:
    container_name: notifications_db
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: notifications
    image: postgres:latest
    restart: always
    volumes:
      - notifications_db:/var/lib/postgres
    ports:
      - 5435:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U postgres -d notifications"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - notifications_service
  notifications:
    container_name: notifications
    build: .
    ports:
      - 5005:5005
    command: npm run start:prod
    depends_on:
      notifications_db:
        condition: service_healthy
    extra_hosts:
      - "docker.for.win.localhost:host-gateway"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: notifications
      POSTGRES_HOST: notifications_db
      POSTGRES_PORT: 5432
    networks:
      - microservices
      - notifications_service
volumes:
  notifications_db:
networks:
  microservices:
    name: microservices
    external: true
  notifications_service: