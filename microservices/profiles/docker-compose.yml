version: '0.0'
services:
  profiles_db: 
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: profiles
    image: postgres:latest
    restart: always
    volumes:
      - profiles_db:/var/lib/postgres
    ports:
      - 5442:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U postgres -d profiles"]
      interval: 10s
      timeout: 5s
      retries: 5
  profiles: 
    build: .
    ports:
      - 5012:5012
    command: npm run start:prod
    depends_on:
      profiles_db:
        condition: service_healthy
    extra_hosts:
      - "docker.for.win.localhost:host-gateway"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: profiles
      POSTGRES_HOST: profiles_db
      POSTGRES_PORT: 5432
volumes:
  profiles_db: