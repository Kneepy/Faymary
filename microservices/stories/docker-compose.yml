version: '0.0'
services:
  stories_db: 
    container_name: stories_db
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: stories
    image: postgres:latest
    restart: always
    volumes:
      - stories_db:/var/lib/postgres
    ports:
      - 5439:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U postgres -d stories"]
      interval: 10s
      timeout: 5s
      retries: 5
  stories: 
    container_name: stories
    build: .
    ports:
      - 5009:5009
    command: npm run start:prod
    depends_on:
      stories_db:
        condition: service_healthy
    extra_hosts:
      - "docker.for.win.localhost:host-gateway"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: stories
      POSTGRES_HOST: stories_db
      POSTGRES_PORT: 5432
volumes:
  stories_db: